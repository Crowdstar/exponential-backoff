name: Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    name: Tests Under PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole
          tools: composer:v2
          coverage: none

      # Extension swoole is enabled per step instead of globally, so that the unit tests run both with and without it.
      - name: Disable Swoole by default
        run: sudo phpdismod -s cli swoole

      - name: Install dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run Unit Tests without Swoole
        run: ./vendor/bin/counit

      - name: Run Unit Tests with Swoole
        run: php -d extension=swoole ./vendor/bin/counit

      - name: Run Syntax Checks
        run: docker run -q --rm -v "$(pwd):/project" -w /project -i jakzal/phpqa:php${{ matrix.php }} phplint examples src
